name: Bug report
description: Something in Aisty Community does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or release, e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `docker compose logs app`. Remove any secrets.
      render: text
